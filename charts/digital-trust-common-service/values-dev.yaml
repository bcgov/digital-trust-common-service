# Environment overrides: DEV
# BC Gov OpenShift (Silver) — dev namespace.
# TODO: replace <LICENSE_PLATE> and hostnames with real values from the platform team.

image:
  tag: "dev"          # or a git SHA promoted by CI
  pullPolicy: Always

replicaCount: 1

frontend:
  enabled: true

route:
  enabled: true
  # TODO: confirm hostname (typically *.apps.silver.devops.gov.bc.ca)
  host: digital-trust-common-service-dev.apps.silver.devops.gov.bc.ca
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false

# The hook Job brings dev to the current schema before the pods roll. It reads
# the pre-provisioned database Secret named under `secret` below.
migrations:
  enabled: true

worker:
  enabled: false
  replicaCount: 1
  autoscaling:
    enabled: false

# Export traces and metrics to the platform collector. Service names stay at
# the chart defaults: each environment writes to its own backend, so the
# backend already tells you which one you are querying.
otel:
  enabled: true
  endpoint: http://monitoring-collector-alloy:4318

config:
  NODE_ENV: development
  OIDC_ISSUER: https://digital-trust-common-service-dev.apps.silver.devops.gov.bc.ca/oidc
  LOG_LEVEL: debug
  # Bare hostname only — DB_PORT defaults to 5432 separately, do not append ":5432" here.
  DB_HOST: digital-trust-common-service-db
  DB_NAME: dc_common_service
  DB_LOGGING: "true"

secret:
  # DB_USERNAME / DB_PASSWORD (and any signing/HMAC secrets the app reads).
  existingSecret: digital-trust-common-service-secret
  create: false

networkPolicy:
  enabled: true
  keycloak:
    enabled: true
  collector:
    enabled: true
    # Selectors left empty until the platform team confirms the collector's
    # namespace and pod labels. Empty renders a rule with no `to:` block, which
    # permits egress to any destination on 4318 — the same shape as the database
    # and Keycloak rules, but it should be narrowed once those labels are known.

connectorEncryption:
  existingSecret: digital-trust-common-service-dev-connector-encryption
  create: false

# Signing keys are provisioned by ops, not the chart. Generate the JWKS with
# `node scripts/generate-oidc-keys.mjs oidc-keys.json` and load it into the Secret,
# alongside an OIDC_COOKIE_KEYS entry.
oidcSigning:
  existingSecret: digital-trust-common-service-dev-oidc-signing
  create: false

upstreamFederation:
  existingSecret:
    name: dtsc-dev-oidc-client
    key: upstream-identity-federation.json
