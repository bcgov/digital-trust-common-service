# CI test values: render/lint the chart with all major components enabled and
# without depending on cluster-provisioned secrets. Used by `helm template`
# and `helm lint` in CI pipelines.
image:
  registry: ghcr.io
  repository: bcgov/digital-trust-common-service
  tag: ci

frontend:
  enabled: true
  image:
    registry: ghcr.io
    repository: bcgov/digital-trust-common-service-ui
    tag: ci

route:
  enabled: true
  host: digital-trust-common-service.example.com

worker:
  enabled: true
  autoscaling:
    enabled: true

autoscaling:
  enabled: true

migrations:
  enabled: true

secret:
  # A chart-managed Secret cannot serve the pre-install migration hook (see
  # migrations.enabled in values.yaml), so name one instead; nothing is looked
  # up when rendering.
  existingSecret: ci-secret

networkPolicy:
  enabled: true
  keycloak:
    enabled: true

connectorEncryption:
  create: true
  currentVersion: 1
  # Deterministic fixture for client-side render/lint in CI.
  keys:
    "1": ci-connector-encryption-key

upstreamFederation:
  existingSecret:
    name: dtsc-ci-oidc-client

config:
  DB_HOST: postgres
