# PR Environment overlay — only deltas from the chart defaults.
# Used by .github/workflows/pr-deploy.yml for ephemeral PR review environments.
# Per-PR values (image.tag, config.DB_NAME, route.host) and config.DB_HOST
# (from the PR_DB_HOST repository variable) are injected via --set.

# Two replicas so PR deploys run a realistic multi-replica topology: every pod
# must load the same OIDC signing JWKS from the shared Secret, or a token minted
# by one pod fails verification against another's /oidc/jwks. Note this does not
# by itself prove the cross-pod path (the workflow only waits for readiness);
# a per-pod smoke check and the interactive/session path land with AU-02 (#35).
replicaCount: 2

image:
  pullPolicy: Always

resources:
  requests:
    cpu: 25m

config:
  NODE_ENV: development
  LOG_LEVEL: debug
  DB_HOST: digital-trust-common-service-pr-db
  DB_LOGGING: "true"
  # Two replicas share the PR database, so cap each pod's pool to keep the
  # total (2 x max + worker + migration Job) well under the primary's
  # max_connections. Applies the sizing guidance from .env.example.
  DB_POOL_MAX: "5"

secret:
  # PR databases are owned by the same application user as dev; reuse the dev Secret.
  # (With existingSecret set the chart creates no Secret of its own; leftover
  # per-PR objects are removed by pr-cleanup.yml's label-based delete.)
  existingSecret: digital-trust-common-service-pr-secret

connectorEncryption:
  existingSecret: ""
  create: true

  currentVersion: 1
  keys:
    "1": <generated-per-deployment-key>

oidcSigning:
  existingSecret: ""
  create: true
  # Preview Secrets are per-PR and disposable; pr-cleanup.yml removes them
  # with the rest of the release.
  retainOnUninstall: false
  # oidcSigning.keys is injected by pr-deploy.yml (--set-file) the first time
  # a PR deploys, and omitted afterwards so redeploys reuse the same key.
