{{- if and .Values.connectorEncryption.create (not .Values.connectorEncryption.existingSecret) -}}
{{- $secretName := include "digital-trust-common-service.connectorEncryptionSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := (default dict (get (default dict $existing) "data")) -}}
{{- $keys := .Values.connectorEncryption.keys -}}
{{- $encryptionKeysJson := "" -}}
{{- if and $keys (gt (len $keys) 0) -}}
{{- $encryptionKeysJson = (dict "currentVersion" .Values.connectorEncryption.currentVersion "keys" $keys) | toPrettyJson -}}
{{- else -}}
{{- $encryptionKeysJson = get $existingData "encryption-keys.json" | default "" | b64dec -}}
{{- end -}}
{{- if not $encryptionKeysJson -}}
{{- fail "connectorEncryption.create is set but no encryption keys are available. On first deploy, pass a generated key via --set connectorEncryption.keys.1=<hex-key>, or point connectorEncryption.existingSecret at a pre-provisioned Secret." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  {{- if .Values.connectorEncryption.retainOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  encryption-keys.json: |
    {{- $encryptionKeysJson | nindent 4 }}
{{- end }}
