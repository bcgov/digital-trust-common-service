{{- if .Values.grafana.enabled -}}
{{- if not .Values.logGateway.enabled }}
{{- fail "logGateway.enabled must be true when grafana.enabled is true; the tenant Grafana reads logs only through the gateway" }}
{{- end }}
{{- if not .Values.networkPolicy.enabled }}
{{- fail "networkPolicy.enabled must be true when grafana.enabled is true; the NetworkPolicy is what keeps Grafana off Loki" }}
{{- end }}
{{- if not .Values.grafana.route.host }}
{{- fail "grafana.route.host is required when grafana.enabled is true; it is Grafana's root_url and the OIDC redirect URI" }}
{{- end }}
{{- if not .Values.config.APP_PUBLIC_URL }}
{{- fail "config.APP_PUBLIC_URL is required when grafana.enabled is true; it is the OIDC issuer origin" }}
{{- end }}
{{- if not .Values.config.LOG_GATEWAY_AUDIENCE }}
{{- fail "config.LOG_GATEWAY_AUDIENCE is required when grafana.enabled is true; it is the resource indicator requested at sign-in" }}
{{- end }}
{{- $issuer := printf "%s/oidc" (trimSuffix "/" .Values.config.APP_PUBLIC_URL) -}}
{{- $gateway := printf "https://%s.%s.svc:%v" (include "digital-trust-common-service.logGateway.fullname" .) .Release.Namespace .Values.logGateway.service.port -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "digital-trust-common-service.grafana.configMapName" . }}
  labels:
    {{- include "digital-trust-common-service.grafana.labels" . | nindent 4 }}
data:
  # Everything below that hides or disables UI is usability only. A signed-in
  # user can still send arbitrary queries with their own token, and the gateway
  # scopes each one to that token's tenant.
  grafana.ini: |
    [server]
    root_url = https://{{ .Values.grafana.route.host }}
    # The Route re-encrypts, so Grafana itself serves TLS with the certificate
    # OpenShift issues for its Service, and reloads it when it rotates.
    protocol = https
    cert_file = /var/run/secrets/grafana-tls/tls.crt
    cert_key = /var/run/secrets/grafana-tls/tls.key
    certs_watch_interval = 1h

    [security]
    # No local admin: the only way in is OIDC, and every user is a Viewer.
    disable_initial_admin_creation = true
    cookie_secure = true
    cookie_samesite = lax
    # The avatar proxy would send a hash of each user's email to Gravatar.
    disable_gravatar = true

    [analytics]
    reporting_enabled = false
    check_for_updates = false
    check_for_plugin_updates = false
    feedback_links_enabled = false

    [news]
    news_feed_enabled = false

    [help]
    enabled = false

    [profile]
    enabled = false

    [plugins]
    plugin_admin_enabled = false
    # Otherwise every start installs plugins from grafana.com and updates the
    # bundled ones, the Loki plugin that forwards users' tokens included, to
    # versions this chart never pinned.
    preinstall_disabled = true
    # Every bundled datasource but Loki: each would run its own process.
    disable_plugins = cloudwatch,elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,mssql,mysql,opentsdb,prometheus,stackdriver,tempo,zipkin

    [explore]
    enabled = false

    [alerting]
    enabled = false

    [unified_alerting]
    enabled = false

    # A snapshot is served by its key with no sign-in and no token check.
    [snapshots]
    enabled = false

    [public_dashboards]
    enabled = false

    # Live tail is not an allowed gateway route.
    [live]
    max_connections = 0

    [users]
    allow_sign_up = false
    auto_assign_org = true
    auto_assign_org_role = Viewer
    viewers_can_edit = false

    [dashboards]
    default_home_dashboard_path = /etc/grafana/dashboards/tenant-logs.json
    # Every query is charged to the tenant's gateway budget of 120 a minute.
    min_refresh_interval = 1m

    # Splitting a range into a request per day, refreshed by every open tab,
    # lets one viewer spend the whole tenant's budget. Loki still splits each
    # query itself, behind the gateway.
    [feature_toggles]
    lokiQuerySplitting = false

    [auth]
    disable_login_form = true

    [auth.anonymous]
    enabled = false
    hide_version = true

    # On by default with no sign-in, on the port the Route exposes, and its
    # counts span every tenant. Nothing scrapes it.
    [metrics]
    enabled = false

    [auth.basic]
    enabled = false

    [auth.generic_oauth]
    enabled = true
    name = Digital Trust
    auto_login = true
    client_id = {{ .Values.grafana.oidc.clientId }}
    # No profile or email: every tenant shares one Grafana org and any Viewer
    # can list its users, so Grafana keeps only the opaque sub. No logs:read:
    # the gateway checks it on every query, expanding tenants:admin as the API
    # does, which the sign-in check does not. The access token carries the
    # role's scopes either way.
    scopes = openid tenant offline_access
    # The resource indicator makes the access token carry the log gateway
    # audience only. It goes on the authorize URL, as the provider takes it.
    # prompt=consent is what makes the provider issue a refresh token for
    # offline_access; without it panels stop loading after the access token
    # expires. The provider approves it silently, with no consent screen.
    auth_url = {{ $issuer }}/auth?resource={{ .Values.config.LOG_GATEWAY_AUDIENCE | urlquery }}&prompt=consent
    token_url = {{ $issuer }}/token
    # Signing out ends the provider session, which also revokes this Grafana's
    # grant. The provider's page confirms it and stays there, rather than
    # returning to a sign-in that an upstream session could pass silently.
    signout_redirect_url = {{ $issuer }}/session/end
    use_pkce = true
    use_refresh_token = true
    # Creates the Grafana user on first sign-in; [users] allow_sign_up is
    # separate and stays off.
    allow_sign_up = true
    # Each tenant membership is its own sub, so one person in two tenants is
    # two Grafana users; a shared email would make Grafana refuse the second.
    login_attribute_path = sub
    email_attribute_path = sub
    name_attribute_path = sub
    role_attribute_path = "'Viewer'"
    role_attribute_strict = true
    allow_assign_grafana_admin = false
  datasource.yaml: |
    apiVersion: 1
    datasources:
      # The one shared datasource. It carries no per-user identity: the gateway
      # derives it from the forwarded bearer token (Rule S2).
      - name: Logs
        uid: logs
        type: loki
        access: proxy
        url: {{ $gateway }}
        isDefault: true
        editable: false
        jsonData:
          oauthPassThru: true
          tlsAuthWithCACert: true
          # Seconds, above the gateway's upstream timeout so a slow query gets
          # Loki's answer rather than a 30s default. A bare number: the plugin
          # ignores a quoted one.
          timeout: 70
        secureJsonData:
          tlsCACert: $__file{/var/run/secrets/openshift-service-ca/service-ca.crt}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: tenant-logs
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "digital-trust-common-service.grafana.dashboardsConfigMapName" . }}
  labels:
    {{- include "digital-trust-common-service.grafana.labels" . | nindent 4 }}
data:
  tenant-logs.json: |
    {{- .Files.Get "files/grafana/tenant-logs.json" | nindent 4 }}
---
# OpenShift fills this with the service CA bundle, which signs the log
# gateway's serving certificate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "digital-trust-common-service.grafana.caBundleConfigMapName" . }}
  labels:
    {{- include "digital-trust-common-service.grafana.labels" . | nindent 4 }}
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
{{- end }}
