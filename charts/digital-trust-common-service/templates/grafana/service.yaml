{{- if .Values.grafana.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "digital-trust-common-service.grafana.fullname" . }}
  labels:
    {{- include "digital-trust-common-service.grafana.labels" . | nindent 4 }}
spec:
  type: {{ .Values.grafana.service.type }}
  ports:
    - port: {{ .Values.grafana.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "digital-trust-common-service.grafana.selectorLabels" . | nindent 4 }}
{{- end }}
