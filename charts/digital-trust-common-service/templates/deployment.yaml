apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "digital-trust-common-service.fullname" . }}
  labels:
    {{- include "digital-trust-common-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "digital-trust-common-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.connectorEncryption.create }}
        checksum/connector-encryption: {{ include (print $.Template.BasePath "/connector-encryption-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.oidcSigning.create }}
        checksum/oidc-signing: {{ include (print $.Template.BasePath "/oidc-signing-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "digital-trust-common-service.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- $connectorSecret := or .Values.connectorEncryption.create .Values.connectorEncryption.existingSecret }}
      {{- $oidcSecret := or .Values.oidcSigning.create .Values.oidcSigning.existingSecret }}
      {{- $upstreamFederationSecretName := required "upstreamFederation.existingSecret.name is required" .Values.upstreamFederation.existingSecret.name }}
      {{- $upstreamFederationSecretKey := required "upstreamFederation.existingSecret.key is required" .Values.upstreamFederation.existingSecret.key }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "digital-trust-common-service.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "digital-trust-common-service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            {{- include "digital-trust-common-service.envFrom" . | nindent 12 }}
          env:
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: UPSTREAM_IDENTITY_FEDERATION_CONFIG_PATH
              value: {{ printf "%s/%s" .Values.upstreamFederation.mountPath .Values.upstreamFederation.fileName | quote }}
            {{- if or .Values.oidcSigning.create .Values.oidcSigning.existingSecret }}
            # Marked optional so a pre-provisioned Secret that only carries the
            # signing JWKS still starts; the application fails fast on its own
            # if cookie keys are missing in production.
            - name: OIDC_COOKIE_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "digital-trust-common-service.oidcSigningSecretName" . }}
                  key: OIDC_COOKIE_KEYS
                  optional: true
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $connectorSecret }}
            - name: connector-encryption
              mountPath: {{ .Values.connectorEncryption.mountPath }}
              readOnly: true
            {{- end }}
            {{- if $oidcSecret }}
            - name: oidc-signing
              mountPath: {{ .Values.oidcSigning.mountPath }}
              readOnly: true
            {{- end }}
            - name: upstream-federation-config
              mountPath: {{ .Values.upstreamFederation.mountPath }}
              readOnly: true

      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $connectorSecret }}
        - name: connector-encryption
          secret:
            secretName: {{ include "digital-trust-common-service.connectorEncryptionSecretName" . }}
        {{- end }}
        {{- if $oidcSecret }}
        - name: oidc-signing
          secret:
            secretName: {{ include "digital-trust-common-service.oidcSigningSecretName" . }}
        {{- end }}
        - name: upstream-federation-config
          secret:
            secretName: {{ include "digital-trust-common-service.upstreamFederationSecretName" . }}
            items:
              - key: {{ $upstreamFederationSecretKey }}
                path: {{ .Values.upstreamFederation.fileName }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
