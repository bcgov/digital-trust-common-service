{{- if .Values.logGateway.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "digital-trust-common-service.logGateway.fullname" . }}
  labels:
    {{- include "digital-trust-common-service.logGateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.logGateway.autoscaling.enabled }}
  replicas: {{ .Values.logGateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "digital-trust-common-service.logGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # A subPath mount does not pick up ConfigMap changes in place, so this
        # checksum is what rolls the pods when envoy.yaml changes.
        checksum/config: {{ include (print $.Template.BasePath "/log-gateway/configmap.yaml") . | sha256sum }}
        {{- with .Values.logGateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "digital-trust-common-service.logGateway.selectorLabels" . | nindent 8 }}
        {{- with .Values.logGateway.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "digital-trust-common-service.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: log-gateway
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "digital-trust-common-service.logGateway.image" . }}
          imagePullPolicy: {{ .Values.logGateway.image.pullPolicy }}
          args:
            - -c
            - /etc/envoy/envoy.yaml
            - --disable-hot-restart
          env:
            - name: LOKI_AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.logGateway.upstream.auth.existingSecret.name . }}
                  key: {{ .Values.logGateway.upstream.auth.existingSecret.key }}
          ports:
            - name: https
              containerPort: {{ .Values.logGateway.service.targetPort }}
              protocol: TCP
            - name: probe
              containerPort: {{ .Values.logGateway.probePort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.logGateway.metrics.port }}
              protocol: TCP
          {{- with .Values.logGateway.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.logGateway.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.logGateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: log-gateway-config
              mountPath: /etc/envoy/envoy.yaml
              subPath: envoy.yaml
              readOnly: true
            - name: log-gateway-tls
              mountPath: {{ .Values.logGateway.tls.mountPath }}
              readOnly: true
            - name: service-ca
              mountPath: /var/run/secrets/openshift-service-ca
              readOnly: true
      volumes:
        - name: log-gateway-config
          configMap:
            name: {{ include "digital-trust-common-service.logGateway.configMapName" . }}
        - name: log-gateway-tls
          secret:
            secretName: {{ include "digital-trust-common-service.logGateway.fullname" . }}-tls
        - name: service-ca
          configMap:
            name: {{ include "digital-trust-common-service.logGateway.caBundleConfigMapName" . }}
      {{- with .Values.logGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.logGateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.logGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
