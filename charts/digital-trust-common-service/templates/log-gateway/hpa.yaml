{{- if and .Values.logGateway.enabled .Values.logGateway.autoscaling.enabled (or .Values.logGateway.autoscaling.targetCPUUtilizationPercentage .Values.logGateway.autoscaling.targetMemoryUtilizationPercentage) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "digital-trust-common-service.logGateway.fullname" . }}
  labels:
    {{- include "digital-trust-common-service.logGateway.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "digital-trust-common-service.logGateway.fullname" . }}
  minReplicas: {{ .Values.logGateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.logGateway.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.logGateway.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.logGateway.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.logGateway.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.logGateway.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
