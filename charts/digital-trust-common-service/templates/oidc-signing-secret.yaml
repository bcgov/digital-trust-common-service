{{- if and .Values.oidcSigning.create (not .Values.oidcSigning.existingSecret) -}}
{{- $secretName := include "digital-trust-common-service.oidcSigningSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := (default dict (get (default dict $existing) "data")) -}}
{{/*
An RS256 JWKS cannot be produced with Helm's template functions, so the
document is supplied by the caller (see scripts/generate-oidc-keys.mjs, e.g.
`--set-file oidcSigning.keys=oidc-keys.json`). Upgrades that pass nothing keep
whatever the live Secret already holds, so a routine `helm upgrade` does not
silently rotate the signing key and invalidate every issued token.
*/}}
{{- $keys := .Values.oidcSigning.keys -}}
{{- if not $keys -}}
{{- $keys = get $existingData "oidc-keys.json" | default "" | b64dec -}}
{{- end -}}
{{- if not $keys -}}
{{- fail "oidcSigning.create is set but no signing keys are available. Generate a JWKS with `npm run oidc:generate-keys > oidc-keys.json` and pass it via `--set-file oidcSigning.keys=oidc-keys.json`, or point oidcSigning.existingSecret at a pre-provisioned Secret." -}}
{{- end -}}
{{- $cookieKeys := .Values.oidcSigning.cookieKeys -}}
{{- if not $cookieKeys -}}
{{- $cookieKeys = get $existingData "OIDC_COOKIE_KEYS" | default "" | b64dec -}}
{{- end -}}
{{- if not $cookieKeys -}}
{{- $cookieKeys = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "digital-trust-common-service.labels" . | nindent 4 }}
  {{- if .Values.oidcSigning.retainOnUninstall }}
  annotations:
    "helm.sh/resource-policy": keep
  {{- end }}
type: Opaque
stringData:
  oidc-keys.json: |
    {{- $keys | nindent 4 }}
  OIDC_COOKIE_KEYS: {{ $cookieKeys | quote }}
{{- end }}
