{{- if .Values.networkPolicy.enabled -}}
{{- $baseSelector := dict "app.kubernetes.io/name" (include "digital-trust-common-service.name" .) "app.kubernetes.io/instance" .Release.Name -}}
{{- if .Values.networkPolicy.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "digital-trust-common-service.fullname" . }}-allow-router
  labels:
    {{- if .Values.frontend.enabled }}
    {{- include "digital-trust-common-service.frontend.labels" . | nindent 4 }}
    {{- else }}
    {{- include "digital-trust-common-service.api.labels" . | nindent 4 }}
    {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- if .Values.frontend.enabled }}
      {{- include "digital-trust-common-service.frontend.selectorLabels" . | nindent 6 }}
      {{- else }}
      {{- include "digital-trust-common-service.api.selectorLabels" . | nindent 6 }}
      {{- end }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingress.routerNamespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: http
{{- end }}
{{- if and .Values.networkPolicy.ingress.enabled .Values.frontend.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "digital-trust-common-service.fullname" . }}-allow-frontend-to-api
  labels:
    {{- include "digital-trust-common-service.api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "digital-trust-common-service.api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "digital-trust-common-service.frontend.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
{{- end }}
{{- if .Values.networkPolicy.database.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "digital-trust-common-service.fullname" . }}-egress-db
  labels:
    {{- include "digital-trust-common-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - api
          - worker
    {{- if $baseSelector }}
    matchLabels:
      {{- toYaml $baseSelector | nindent 6 }}
    {{- end }}
  policyTypes:
    - Egress
  egress:
    - {{- if or .Values.networkPolicy.database.namespaceSelector .Values.networkPolicy.database.podSelector }}
      to:
        {{- if .Values.networkPolicy.database.namespaceSelector }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.database.namespaceSelector | nindent 14 }}
          {{- with .Values.networkPolicy.database.podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
        {{- else if .Values.networkPolicy.database.podSelector }}
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.database.podSelector | nindent 14 }}
        {{- end }}
      {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.database.port }}
{{- end }}
{{- if .Values.networkPolicy.keycloak.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "digital-trust-common-service.fullname" . }}-egress-keycloak
  labels:
    {{- include "digital-trust-common-service.api.labels" . | nindent 4 }}
spec:
  # Only the API reaches Keycloak (upstream IdP).
  podSelector:
    matchLabels:
      {{- include "digital-trust-common-service.api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - {{- if or .Values.networkPolicy.keycloak.namespaceSelector .Values.networkPolicy.keycloak.podSelector }}
      to:
        {{- if .Values.networkPolicy.keycloak.namespaceSelector }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.keycloak.namespaceSelector | nindent 14 }}
          {{- with .Values.networkPolicy.keycloak.podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
        {{- else if .Values.networkPolicy.keycloak.podSelector }}
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.keycloak.podSelector | nindent 14 }}
        {{- end }}
      {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.keycloak.port }}
{{- end }}
{{- if and .Values.networkPolicy.dnsEgress.enabled (or .Values.networkPolicy.database.enabled .Values.networkPolicy.keycloak.enabled) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "digital-trust-common-service.fullname" . }}-egress-dns
  labels:
    {{- include "digital-trust-common-service.labels" . | nindent 4 }}
spec:
  # Allow DNS resolution for API/Worker pods when egress rules are enabled.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - api
          - worker
    {{- if $baseSelector }}
    matchLabels:
      {{- toYaml $baseSelector | nindent 6 }}
    {{- end }}
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        {{- range .Values.networkPolicy.dnsEgress.ports }}
        - protocol: UDP
          port: {{ . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
{{- if .Values.frontend.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "digital-trust-common-service.frontend.fullname" . }}-egress-api
  labels:
    {{- include "digital-trust-common-service.frontend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "digital-trust-common-service.frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "digital-trust-common-service.api.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
{{- if .Values.networkPolicy.dnsEgress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "digital-trust-common-service.frontend.fullname" . }}-egress-dns
  labels:
    {{- include "digital-trust-common-service.frontend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "digital-trust-common-service.frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        {{- range .Values.networkPolicy.dnsEgress.ports }}
        - protocol: UDP
          port: {{ . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
