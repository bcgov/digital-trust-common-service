{{- if .Values.migrations.enabled -}}
{{- /*
A chart-managed Secret is a release resource, so it does not exist yet when a
pre-install hook runs; a Job that reads it only waits in
CreateContainerConfigError until the deadline. Refuse that up front.
*/ -}}
{{- if and .Values.secret.create (not .Values.secret.existingSecret) (contains "pre-install" .Values.migrations.hook.types) }}
{{- fail "migrations.enabled with a pre-install hook requires secret.existingSecret: the chart-managed Secret (secret.create) does not exist yet when the hook Job runs. Pre-provision the Secret and set secret.existingSecret to its name." }}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "digital-trust-common-service.fullname" . }}-migrate
  labels:
    helm.sh/chart: {{ include "digital-trust-common-service.chart" . }}
    app.kubernetes.io/name: {{ include "digital-trust-common-service.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: migration
    {{- if .Chart.AppVersion }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    {{- end }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: {{ include "digital-trust-common-service.name" . }}
  annotations:
    # Run migrations once per release, before the app pods roll. Running as a
    # hook (instead of a per-pod init container) guarantees a single execution
    # and avoids concurrent migration runs across replicas / HPA scale-ups.
    "helm.sh/hook": {{ .Values.migrations.hook.types | quote }}
    "helm.sh/hook-weight": {{ .Values.migrations.hook.weight | quote }}
    "helm.sh/hook-delete-policy": {{ .Values.migrations.hook.deletePolicy | quote }}
    {{- if .Values.migrations.argocd.enabled }}
    # ArgoCD does not execute Helm hooks; PreSync gives the equivalent ordering
    # (migrations complete before the main sync rolls the Deployment) under GitOps.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- end }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "digital-trust-common-service.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # A chart-created ServiceAccount is a release resource, which does not
      # exist yet when a pre-install hook runs — the pod is refused with
      # "serviceaccount not found". Only a pre-existing one can be named here;
      # otherwise the namespace default serves, with the token kept out of the
      # pod the same way the chart's own ServiceAccount does.
      {{- if not .Values.serviceAccount.create }}
      serviceAccountName: {{ include "digital-trust-common-service.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.migrations.waitForDB.enabled }}
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.migrations.waitForDB.image }}:{{ .Values.migrations.waitForDB.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              timeout {{ .Values.migrations.waitForDB.timeoutSeconds }}s sh -c \
                'until nc -z "$DB_HOST" "$DB_PORT"; do echo "waiting for database $DB_HOST:$DB_PORT"; sleep 2; done' \
              || { echo "timed out after {{ .Values.migrations.waitForDB.timeoutSeconds }}s waiting for database $DB_HOST:$DB_PORT"; exit 1; }
          # Inline rather than the release ConfigMap — see hookEnv in _helpers.tpl.
          env:
            {{- include "digital-trust-common-service.hookEnv" . | trim | nindent 12 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "digital-trust-common-service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            {{- toYaml .Values.migrations.command | nindent 12 }}
          {{- with .Values.migrations.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Inline rather than the release ConfigMap, which does not exist yet
          # when a pre-install hook runs — see hookEnv in _helpers.tpl.
          env:
            {{- include "digital-trust-common-service.hookEnv" . | trim | nindent 12 }}
          {{- with include "digital-trust-common-service.hookEnvFrom" . | trim }}
          envFrom:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
