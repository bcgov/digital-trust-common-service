# Environment overrides: PROD
# BC Gov OpenShift (Silver/Gold) — production namespace.
# TODO: replace <LICENSE_PLATE> and hostnames with real values from the platform team.

image:
  tag: "1.0.0"        # pin an immutable released tag in production
  pullPolicy: IfNotPresent

replicaCount: 3

frontend:
  enabled: true

route:
  enabled: true
  # TODO: confirm production hostname.
  host: digital-trust-common-service.apps.silver.devops.gov.bc.ca
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 75

# The hook Job brings the database to the current schema before the pods roll.
# It reads the pre-provisioned database Secret named under `secret` below.
migrations:
  enabled: true

worker:
  enabled: false     # TODO: enable once dist/worker.js ships
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

config:
  NODE_ENV: production
  OIDC_ISSUER: https://digital-trust-common-service.apps.silver.devops.gov.bc.ca/oidc
  LOG_LEVEL: info
  # TODO: point at the production PostgreSQL service.
  DB_HOST: <PROD_DB_HOST>
  DB_NAME: dc_common_service
  DB_SYNCHRONIZE: "false"
  DB_LOGGING: "false"

secret:
  # TODO: name of the pre-provisioned Secret in the production namespace.
  existingSecret: digital-trust-common-service-secret
  create: false

networkPolicy:
  enabled: true
  keycloak:
    enabled: true

connectorEncryption:
  existingSecret: digital-trust-common-service-prod-connector-encryption
  create: false

# Signing keys are provisioned by ops, not the chart. Generate the JWKS with
# `node scripts/generate-oidc-keys.mjs oidc-keys.json` and load it into the Secret,
# alongside an OIDC_COOKIE_KEYS entry.
oidcSigning:
  existingSecret: digital-trust-common-service-prod-oidc-signing
  create: false

upstreamFederation:
  existingSecret:
    name: dtsc-oidc-client
    key: upstream-identity-federation.json
