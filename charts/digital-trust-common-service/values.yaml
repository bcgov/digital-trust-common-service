# Default values for digital-trust-common-service.
# Deploys the Digital Credential Common Service (NestJS) to BC Gov OpenShift.
# Per-environment overrides live in values-{dev,test,prod}.yaml.

# -- Number of API pod replicas (ignored when `autoscaling.enabled=true`)
replicaCount: 1

# -- Override the chart name
nameOverride: ""
# -- Override the fully qualified release name
fullnameOverride: ""

image:
  # -- Container image registry (optional; omitted from the ref when empty)
  registry: ghcr.io
  # -- Container image repository. API, Worker and migrations share this image.
  repository: bcgov/digital-trust-common-service
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag (defaults to the chart appVersion when empty)
  tag: ""

# -- Names of pre-created image pull secrets, e.g. `[{ name: my-registry }]`
imagePullSecrets: []

serviceAccount:
  # -- Create a service account
  create: true
  # -- Automatically mount the service account's API credentials. Off by default:
  # nothing in the API, Worker or UI talks to the Kubernetes API.
  automount: false
  # -- Annotations for the service account
  annotations: {}
  # -- Service account name (generated from the fullname when empty and `create` is true)
  name: ""

# -- Annotations added to the API/Worker pods
podAnnotations: {}
# -- Labels added to the API/Worker pods
podLabels: {}

# -- Pod security context. On BC Gov OpenShift the restricted-v2 SCC assigns
# UID/fsGroup/SELinux automatically; leave empty unless you must pin values.
podSecurityContext: {}
  # fsGroup: 2000

# -- Container security context applied to all containers
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

service:
  # -- Service type
  type: ClusterIP
  # -- Service port exposed to the cluster
  port: 8080
  # -- Container port the NestJS app binds to (the `PORT` env)
  targetPort: 3000

# OpenShift Route (default exposure mechanism on BC Gov clusters).
route:
  # -- Expose the service via an OpenShift Route
  enabled: true
  # -- Route hostname (OpenShift generates one when empty)
  host: ""
  # -- Optional explicit route path
  path: ""
  # -- Additional annotations for the Route
  annotations: {}
  tls:
    # -- Enable TLS on the Route
    enabled: true
    # -- TLS termination type
    termination: edge
    # -- Policy for insecure (HTTP) traffic
    insecureEdgeTerminationPolicy: Redirect

# Kubernetes Ingress (optional alternative to the Route).
ingress:
  # -- Expose the service via a Kubernetes Ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
  # -- Ingress hosts and paths
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration
  tls: []

# UI frontend deployment (React SPA served by Caddy).
# Turning it off leaves the Route and Ingress pointing straight at
# the API service.
frontend:
  # -- Deploy the UI frontend
  enabled: true
  # -- Frontend replicas (ignored when `frontend.autoscaling.enabled=true`)
  replicaCount: 1
  image:
    # -- Frontend image registry
    registry: ghcr.io
    # -- Frontend image repository
    repository: bcgov/digital-trust-common-service-ui
    # -- Frontend image pull policy
    pullPolicy: IfNotPresent
    # -- Frontend image tag (falls back to `image.tag`, then chart appVersion)
    tag: ""
  service:
    # -- Frontend Service type
    type: ClusterIP
    # -- Frontend Service port exposed to the cluster
    port: 8080
    # -- Frontend container port (Caddy listener)
    targetPort: 8080
  # -- URL paths reverse-proxied from the frontend to the API service
  proxyPaths:
    - /api/*
    - /oidc/*
    - /health/*
  # Runtime configuration for the SPA. Rendered into the frontend ConfigMap as
  # `config.json` and mounted over the copy the image ships at
  # /srv/config.json; the SPA fetches it once, before it mounts. This is what
  # lets one UI image serve every environment: Vite inlines VITE_* values at
  # build time, so anything that differs between deployments has to arrive
  # this way instead.
  config:
    # -- client_id the SPA presents to the OIDC provider. Each environment registers a public (PKCE) client under this id on the provider side; the development seed registers `dtsc-ui`.
    oidcClientId: dtsc-ui
    # -- Scopes the SPA requests at sign-in. Keep to the set every role holds: the provider rejects, rather than trims, a request for scopes the user's role lacks, and `readonly` carries no API scopes at all.
    oidcScopes: openid profile email tenant offline_access
  # Caddy only preserves an inbound X-Forwarded-Proto when the immediate peer is
  # trusted; otherwise it rewrites the header with the scheme it saw itself. The
  # OpenShift router terminates TLS at the edge and forwards plain http, so
  # without this the API sees `x-forwarded-proto: http` and every OIDC discovery
  # endpoint is derived as http:// while `issuer` stays https://. Narrow to the
  # router's own CIDR where you know it.
  # -- Peers whose `X-Forwarded-*` headers Caddy trusts. An empty list omits the block entirely.
  trustedProxies:
    - private_ranges
  # -- Resource requests and limits for the frontend container
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # -- Liveness probe for the frontend container
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  # -- Readiness probe for the frontend container
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # -- Annotations added to frontend pods
  podAnnotations: {}
  # -- Labels added to frontend pods
  podLabels: {}
  autoscaling:
    # -- Enable autoscaling for the frontend Deployment
    enabled: false
    # -- Minimum frontend replicas
    minReplicas: 1
    # -- Maximum frontend replicas
    maxReplicas: 3
    # -- Target average CPU utilization (percentage)
    targetCPUUtilizationPercentage: 80
    # -- Target average memory utilization (percentage)
    # targetMemoryUtilizationPercentage: 80
  # -- Node selector for frontend pods
  nodeSelector: {}
  # -- Tolerations for frontend pods
  tolerations: []
  # -- Affinity for frontend pods
  affinity: {}

# -- Resource requests and limits for the API container
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# -- Liveness probe. IN-01 provides a minimal 200 at `/health/live`.
# -- Startup probe. Gates the liveness and readiness probes until the app is up,
# so a slow boot (Nest module init, DB connect) can't be killed by liveness.
# `failureThreshold` x `periodSeconds` is the boot budget — 30 x 5s = 150s.
startupProbe:
  httpGet:
    path: /health/live
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3
# -- Readiness probe. `/health/ready` reports whether this pod should receive
# traffic: it fails during graceful shutdown and when the database is
# unreachable, and deliberately ignores pg-boss, the OIDC provider and Traction.
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Horizontal Pod Autoscaler for the API Deployment.
autoscaling:
  # -- Enable autoscaling for the API Deployment
  enabled: false
  # -- Minimum API replicas
  minReplicas: 1
  # -- Maximum API replicas
  maxReplicas: 3
  # -- Target average CPU utilization (percentage)
  targetCPUUtilizationPercentage: 80
  # -- Target average memory utilization (percentage)
  # targetMemoryUtilizationPercentage: 80

# Database migrations run as a Helm hook Job (pre-install/pre-upgrade).
# Off by default; each environment overlay decides.
migrations:
  # -- Run database migrations as a pre-install/pre-upgrade Helm hook Job.
  # Runs exactly once per release before the app pods roll, avoiding the
  # concurrent/every-boot execution that an init container would cause across
  # replicas and HPA scale-ups. A hook runs before the release's own resources
  # exist, so the Job carries the non-secret `config.*` inline, runs under the
  # namespace default ServiceAccount unless `serviceAccount.create` is false,
  # and requires `secret.existingSecret` (a chart-managed Secret would not
  # exist yet on a first install, so that combination is refused at render
  # time).
  enabled: false
  # -- Migration entrypoint command
  command:
    - node
  # -- Migration entrypoint args: the TypeORM CLI against the compiled DataSource — what `npm run migrate:up` runs, invoked directly so the Job needs neither npm nor a writable home directory.
  args:
    - node_modules/typeorm/cli.js
    - migration:run
    - -d
    - dist/libs/database/src/data-source.js
  # -- Helm hook configuration for the migration Job. `pre-install,pre-upgrade`
  # is fail-closed: a failed migration aborts the release and the old version
  # keeps serving. NOTE: the migration runner should still wrap its
  # run in a Postgres advisory lock (pg_advisory_lock/unlock) as defence in
  # depth, since TypeORM does not lock migrations by default.
  hook:
    # -- Helm hook types that trigger the migration Job
    types: "pre-install,pre-upgrade"
    # -- Hook execution order (lower weights run earlier)
    weight: "-5"
    # -- Hook resource delete policy
    deletePolicy: "before-hook-creation,hook-succeeded"
  # -- Number of retries before the migration Job is marked failed (2 retries = 3 total attempts)
  backoffLimit: 2
  # -- Maximum seconds the migration Job may run before Kubernetes marks it failed.
  # Prevents hung migrations (e.g. waiting on a lock) from blocking a release indefinitely.
  activeDeadlineSeconds: 300
  # -- Emit an ArgoCD PreSync hook annotation so migrations also run under GitOps
  # (ArgoCD does not execute Helm hooks natively)
  argocd:
    enabled: false
  # -- Optional init container that blocks the migration until the database
  # (DB_HOST:DB_PORT from the app config) is reachable
  waitForDB:
    enabled: false
    image: busybox
    tag: "1.36"
    # -- Maximum seconds to wait for the database before failing with a clear error
    timeoutSeconds: 60
  # -- Resource requests/limits for the migration Job
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Worker deployment (pg-boss queue consumers). Same image as the API, different
# entrypoint, with its own HPA. Disabled until `dist/worker.js` exists.
worker:
  # -- Deploy the Worker
  enabled: false
  # -- Worker replicas (ignored when `worker.autoscaling.enabled=true`)
  replicaCount: 1
  # -- Worker entrypoint command
  command:
    - node
  # -- Worker entrypoint args
  args:
    - dist/worker.js
  # -- Annotations added to Worker pods
  podAnnotations: {}
  # -- Labels added to Worker pods
  podLabels: {}
  # -- Resource requests/limits for the Worker container
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # -- Liveness probe for the Worker (no HTTP server by default)
  livenessProbe: {}
  autoscaling:
    # -- Enable autoscaling for the Worker Deployment
    enabled: false
    # -- Minimum Worker replicas
    minReplicas: 1
    # -- Maximum Worker replicas
    maxReplicas: 5
    # -- Target average CPU utilization (percentage)
    targetCPUUtilizationPercentage: 80
    # -- Target average memory utilization (percentage)
    # targetMemoryUtilizationPercentage: 80
  # -- Node selector for Worker pods
  nodeSelector: {}
  # -- Tolerations for Worker pods
  tolerations: []
  # -- Affinity for Worker pods
  affinity: {}

# -- Non-secret application configuration, rendered into a ConfigMap and injected
# as environment variables into all containers.
config:
  NODE_ENV: production
  PORT: "3000"
  LOG_LEVEL: info
  DB_HOST: ""
  DB_PORT: "5432"
  DB_NAME: dc_common_service
  DB_SYNCHRONIZE: "false"
  DB_LOGGING: "false"
  SWAGGER_ENABLED: "true"
  SWAGGER_JSON_ENABLED: "true"
  CONNECTOR_ENCRYPTION_KEYS_PATH: "/etc/connector/encryption-keys.json"
  OIDC_KEYS_PATH: "/etc/oidc/oidc-keys.json"
  # Allow registration of confidential clients for auth code + refresh flow,
  # while retaining existing client_credentials support.
  OIDC_GRANT_TYPES: "client_credentials,authorization_code,refresh_token"
  JWT_AUDIENCE: "https://digital-trust-common-service"
  AUDIT_AUTO_INTERCEPTOR_ENABLED: "false"
  AUDIT_PARTITION_CRON: "0 3 * * *"
  AUDIT_PARTITION_MONTHS_AHEAD: "3"
  # Platform-admin adapter override (CA-02). Off outside debugging.
  ADAPTER_OVERRIDE_ENABLED: "false"

# -- Extra plain environment variables appended to every container (name/value list)
extraEnv: []
# -- Extra envFrom sources (configMapRef/secretRef) for every container
extraEnvFrom: []

# Secrets. By default the chart references a pre-provisioned Secret; set
# `create=true` to have the chart generate/persist secret values instead.
secret:
  # -- Name of an existing Secret to consume for env vars
  existingSecret: ""
  # -- Create a chart-managed Secret from the values below
  create: false
  # -- Keep the chart-managed Secret when the release is uninstalled
  retainOnUninstall: true
  # -- Non-generated key/values placed into the chart-managed Secret
  data:
    DB_USERNAME: ""
    DB_PASSWORD: ""

# Connector encryption secret. The secret is mounted to the containers when either
# `create` is true OR `existingSecret` is provided. The app reads encryption keys from
# the mounted path defined by `mountPath` (default: /etc/connector/encryption-keys.json).
connectorEncryption:
  # -- Name of an existing Secret to use for connector encryption keys (takes precedence
  # over chart-managed creation). When set, the secret volume will be mounted even if
  # `create` is false.
  existingSecret: ""
  # -- Create a chart-managed Secret from the values below
  create: false
  # -- Keep the chart-managed Secret when the release is uninstalled
  retainOnUninstall: true
  # -- Mounted path inside the container
  mountPath: /etc/connector

  currentVersion: 1
  keys:
    "1": "< key placeholder >"

# RS256 signing keys for the OIDC provider. The application only reads the
# JWKS from disk; it never generates one outside local development, so every
# deployed environment needs this Secret.
oidcSigning:
  # -- Name of an existing Secret holding the signing JWKS
  existingSecret: ""
  # -- Create a chart-managed Secret from the values below
  create: false
  # -- Keep the chart-managed Secret when the release is uninstalled
  retainOnUninstall: true
  # -- Mounted path inside the container
  mountPath: /etc/oidc
  # -- RS256 JWKS document. Helm cannot generate one, so it is supplied by the
  # caller: `node scripts/generate-oidc-keys.mjs oidc-keys.json` then
  # `--set-file oidcSigning.keys=oidc-keys.json`. Left empty on upgrade, the
  # keys already in the live Secret are kept.
  keys: ""
  # -- Comma-separated cookie signing secrets (OIDC_COOKIE_KEYS). Generated
  # once and preserved across upgrades when empty. Preservation needs an
  # in-cluster `helm upgrade`; a client-side render (template/diff/GitOps)
  # would rotate them and drop active sessions, so pin them if you use one.
  cookieKeys: ""

upstreamFederation:
  # -- Existing Secret reference for upstream federation config JSON.
  # The chart never creates this Secret; it must be provisioned manually.
  existingSecret:
    name: ""
    key: upstream-identity-federation.json
  # -- Mounted directory that contains the upstream federation config file.
  mountPath: /etc/upstream-identity-federation
  # -- Filename for the upstream federation config JSON.
  fileName: upstream-identity-federation.json


# NetworkPolicy. Restricts ingress to the OpenShift router and declares explicit
# inter-service communication (API/Worker -> Postgres, API -> Keycloak).
networkPolicy:
  # -- Enable NetworkPolicies
  enabled: true
  dnsEgress:
    # -- Allow DNS egress (required whenever any egress rule is enabled)
    enabled: true
    # -- DNS ports to allow. Both are required on OpenShift: pods query the
    # dns-default Service on 53, but CoreDNS actually listens on 5353, and
    # OVN-Kubernetes evaluates egress policy AFTER the service DNAT rewrites
    # the port — allowing only 53 silently drops every DNS packet.
    ports:
      - 53
      - 5353
  ingress:
    # -- Allow ingress from the OpenShift router to the externally exposed
    # component (frontend when enabled, API otherwise)
    enabled: true
    # -- Namespace selector matching the OpenShift router namespace
    routerNamespaceSelector:
      policy-group.network.openshift.io/ingress: ""
  database:
    # -- Allow API/Worker egress to PostgreSQL
    enabled: true
    # -- Database port
    port: 5432
    # -- Pod selector matching the database pods.
    # When both podSelector and namespaceSelector are empty, egress is allowed
    # to any destination on the database port. Set these in per-env values.
    podSelector: {}
    # -- Namespace selector matching the database namespace
    namespaceSelector: {}
  keycloak:
    # -- Allow API egress to Keycloak (upstream IdP)
    enabled: false
    # -- Keycloak port
    port: 443
    # -- Namespace selector matching the Keycloak namespace
    namespaceSelector: {}
    # -- Pod selector matching the Keycloak pods
    podSelector: {}

# -- Extra volumes for the API/Worker pods
volumes: []

# -- Extra volume mounts for the API/Worker containers. The connector
# encryption and OIDC signing mounts are added by the chart alongside their
# Secrets and do not need to be listed here.
volumeMounts: []

# -- Node selector for API pods
nodeSelector: {}
# -- Tolerations for API pods
tolerations: []
# -- Affinity for API pods
affinity: {}
