suite: oidc signing secret
templates:
  - templates/oidc-signing-secret.yaml
tests:
  - it: is not rendered when oidcSigning.create is false
    set:
      oidcSigning:
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: is not rendered when an existing secret is referenced
    set:
      oidcSigning:
        create: true
        existingSecret: pre-provisioned-oidc-signing
    asserts:
      - hasDocuments:
          count: 0

  - it: fails closed when create is set but no signing keys are supplied
    set:
      oidcSigning:
        create: true
        keys: ""
    asserts:
      - failedTemplate:
          errorMessage: "oidcSigning.create is set but no signing keys are available. Generate a JWKS with `npm run oidc:generate-keys > oidc-keys.json` and pass it via `--set-file oidcSigning.keys=oidc-keys.json`, or point oidcSigning.existingSecret at a pre-provisioned Secret."

  - it: renders the secret with the supplied JWKS
    set:
      oidcSigning:
        create: true
        keys: |
          {"keys":[{"kty":"RSA","kid":"test-kid"}]}
        cookieKeys: "explicit-cookie-key-value"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-digital-trust-common-service-oidc-signing
      - matchRegex:
          path: stringData["oidc-keys.json"]
          pattern: '"kid":"test-kid"'

  - it: uses an explicit cookieKeys value verbatim (deterministic)
    set:
      oidcSigning:
        create: true
        keys: |
          {"keys":[{"kty":"RSA","kid":"test-kid"}]}
        cookieKeys: "first-cookie-key,second-cookie-key"
    asserts:
      - equal:
          path: stringData.OIDC_COOKIE_KEYS
          value: "first-cookie-key,second-cookie-key"

  # Documents the render-determinism hazard: with no cookieKeys and no cluster to
  # `lookup` (as in `helm template`/diff/GitOps), the template mints a fresh
  # 48-char random cookie key. This test locks in that fallback so a change that
  # silently alters it (and would invalidate every live session) is caught.
  - it: falls back to a fresh 48-char random cookie key when none is supplied and no live secret exists
    set:
      oidcSigning:
        create: true
        keys: |
          {"keys":[{"kty":"RSA","kid":"test-kid"}]}
        cookieKeys: ""
    asserts:
      - matchRegex:
          path: stringData.OIDC_COOKIE_KEYS
          pattern: '^[A-Za-z0-9]{48}$'

  - it: keeps the secret on uninstall when retainOnUninstall is set
    set:
      oidcSigning:
        create: true
        retainOnUninstall: true
        keys: |
          {"keys":[{"kty":"RSA","kid":"test-kid"}]}
        cookieKeys: "explicit-cookie-key-value"
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
