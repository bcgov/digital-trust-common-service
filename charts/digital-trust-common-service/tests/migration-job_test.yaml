suite: migration job
templates:
  - templates/migration-job.yaml
tests:
  - it: is not rendered by default
    set:
      upstreamFederation:
        existingSecret:
          name: dtsc-ci-oidc-client
    asserts:
      - hasDocuments:
          count: 0

  # The PR overlay is the first environment to enable the Job, and CI only
  # proves the overlay renders; this pins what it renders.
  - it: renders the Job for PR environments with the TypeORM CLI
    values:
      - ../values-pr.yaml
    set:
      # The overlay expects these injected at deploy time.
      oidcSigning:
        keys: '{"keys":[{"kty":"RSA","kid":"test-kid"}]}'
      connectorEncryption:
        keys:
          "1": test-connector-key
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: spec.template.spec.containers[0].command
          value: [node]
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - node_modules/typeorm/cli.js
            - migration:run
            - -d
            - dist/libs/database/src/data-source.js
      # Pre-provisioned, so a hook may reference it.
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: digital-trust-common-service-pr-secret

  # A pre-install hook runs before the release ConfigMap exists; reading env
  # from it leaves the pod in CreateContainerConfigError and the install
  # times out.
  - it: carries its non-secret env inline instead of the release ConfigMap
    values:
      - ../ci/ci-values.yaml
    set:
      upstreamFederation:
        existingSecret:
          name: dtsc-ci-oidc-client
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_HOST
            value: postgres
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-digital-trust-common-service-config
