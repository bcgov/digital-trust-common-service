suite: tenant grafana
templates:
  - templates/grafana/configmap.yaml
  - templates/grafana/deployment.yaml
  - templates/grafana/service.yaml
  - templates/grafana/route.yaml
  - templates/networkpolicy.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0
        template: templates/grafana/deployment.yaml
      - hasDocuments:
          count: 0
        template: templates/grafana/route.yaml

  - it: points one shared datasource at the gateway with no tenant identity
    values:
      - ../ci/ci-values.yaml
    asserts:
      - matchRegex:
          path: data["datasource.yaml"]
          pattern: "url: https://RELEASE-NAME-digital-trust-common-service-log-gateway\\.NAMESPACE\\.svc:8443"
        template: templates/grafana/configmap.yaml
        documentIndex: 0
      - matchRegex:
          path: data["datasource.yaml"]
          pattern: "oauthPassThru: true"
        template: templates/grafana/configmap.yaml
        documentIndex: 0
      - notMatchRegex:
          path: data["datasource.yaml"]
          pattern: "(?i)X-Scope-OrgID|httpHeader|tenant|org"
        template: templates/grafana/configmap.yaml
        documentIndex: 0

  - it: signs in through the OIDC provider for the gateway audience as a Viewer
    values:
      - ../ci/ci-values.yaml
    asserts:
      - matchRegex:
          path: data["grafana.ini"]
          pattern: "auth_url = https://digital-trust-common-service.example.com/oidc/auth\\?resource=https%3A%2F%2Flogs.example.com&prompt=consent"
        template: templates/grafana/configmap.yaml
        documentIndex: 0
      - matchRegex:
          path: data["grafana.ini"]
          pattern: "use_pkce = true"
        template: templates/grafana/configmap.yaml
        documentIndex: 0
      - matchRegex:
          path: data["grafana.ini"]
          pattern: "role_attribute_strict = true"
        template: templates/grafana/configmap.yaml
        documentIndex: 0
      - matchRegex:
          path: data["grafana.ini"]
          pattern: "disable_login_form = true"
        template: templates/grafana/configmap.yaml
        documentIndex: 0

  - it: keeps no names or emails in Grafana's shared org
    values:
      - ../ci/ci-values.yaml
    asserts:
      # No profile or email: every tenant shares one org, and any Viewer can
      # list its users. No logs:read: the gateway checks it, and expands
      # tenants:admin to include it, which the sign-in check does not.
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^\s*scopes = openid tenant offline_access$'
        template: templates/grafana/configmap.yaml
        documentIndex: 0
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^\s*email_attribute_path = sub$'
        template: templates/grafana/configmap.yaml
        documentIndex: 0
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^\s*name_attribute_path = sub$'
        template: templates/grafana/configmap.yaml
        documentIndex: 0
      # The userinfo endpoint refuses tokens bound to the gateway audience.
      - notMatchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^\s*api_url ='
        template: templates/grafana/configmap.yaml
        documentIndex: 0

  - it: keeps TLS on the hop from the router to Grafana (T13)
    values:
      - ../ci/ci-values.yaml
    asserts:
      - equal:
          path: spec.tls.termination
          value: reencrypt
        template: templates/grafana/route.yaml
      - equal:
          path: spec.port.targetPort
          value: https
        template: templates/grafana/route.yaml
      - equal:
          path: metadata.annotations["service.beta.openshift.io/serving-cert-secret-name"]
          value: RELEASE-NAME-digital-trust-common-service-grafana-tls
        template: templates/grafana/service.yaml
      - equal:
          path: spec.ports[0].targetPort
          value: https
        template: templates/grafana/service.yaml
      - matchRegex:
          path: data["grafana.ini"]
          pattern: '(?m)^\s*protocol = https\s+cert_file = /var/run/secrets/grafana-tls/tls\.crt\s+cert_key = /var/run/secrets/grafana-tls/tls\.key\s+certs_watch_interval = 1h$'
        template: templates/grafana/configmap.yaml
        documentIndex: 0
      - contains:
          path: spec.template.spec.volumes
          content:
            name: grafana-tls
            secret:
              secretName: RELEASE-NAME-digital-trust-common-service-grafana-tls
        template: templates/grafana/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.scheme
          value: HTTPS
        template: templates/grafana/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.scheme
          value: HTTPS
        template: templates/grafana/deployment.yaml
      - equal:
          path: spec.ingress[0].ports[0].port
          value: https
        template: templates/networkpolicy.yaml
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-digital-trust-common-service-grafana-allow-router

  - it: limits Grafana egress to the gateway, OIDC over https and DNS
    values:
      - ../ci/ci-values.yaml
    asserts:
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: log-gateway
        template: templates/networkpolicy.yaml
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-digital-trust-common-service-grafana-egress

  - it: lets only Grafana reach the gateway and skips the Route when disabled
    values:
      - ../ci/ci-values.yaml
    set:
      grafana:
        route:
          enabled: false
    asserts:
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: grafana
        template: templates/networkpolicy.yaml
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-digital-trust-common-service-log-gateway-allow-grafana
      - hasDocuments:
          count: 0
        template: templates/grafana/route.yaml

  - it: requires the log gateway
    values:
      - ../ci/ci-values.yaml
    set:
      logGateway:
        enabled: false
    asserts:
      - failedTemplate:
          errorPattern: logGateway.enabled must be true
        template: templates/grafana/deployment.yaml
