suite: secret
templates:
  - templates/secret.yaml
tests:
  - it: is not rendered when an existing Secret is referenced, even with create set
    set:
      secret:
        existingSecret: pre-provisioned-secret
        create: true
      upstreamFederation:
        existingSecret:
          name: dtsc-ci-oidc-client
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the chart-managed Secret from secret.data
    set:
      secret:
        create: true
        data:
          DB_USERNAME: ci-user
          DB_PASSWORD: ci-pass
      upstreamFederation:
        existingSecret:
          name: dtsc-ci-oidc-client
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-digital-trust-common-service-secret
      - equal:
          path: data.DB_USERNAME
          value: Y2ktdXNlcg==
      - equal:
          path: data.DB_PASSWORD
          value: Y2ktcGFzcw==
      # retainOnUninstall defaults to true.
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
