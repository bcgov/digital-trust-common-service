suite: log gateway
templates:
  - templates/log-gateway/configmap.yaml
  - templates/log-gateway/deployment.yaml
  - templates/log-gateway/service.yaml
  - templates/log-gateway/route.yaml
  - templates/log-gateway/hpa.yaml
  - templates/log-access-service.yaml
  - templates/log-gateway/podmonitor.yaml
  - templates/log-gateway/prometheusrule.yaml
  - templates/networkpolicy.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0
        template: templates/log-gateway/deployment.yaml
      - hasDocuments:
          count: 0
        template: templates/log-gateway/service.yaml

  - it: renders the gateway workload and a serving-cert Service
    values:
      - ../ci/ci-values.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: log-gateway
        template: templates/log-gateway/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/envoyproxy/envoy:v1.40.2
        template: templates/log-gateway/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: ci-log-gateway-loki
        template: templates/log-gateway/deployment.yaml
      - isNotNull:
          path: metadata.annotations["service.beta.openshift.io/serving-cert-secret-name"]
        template: templates/log-gateway/service.yaml
      - equal:
          path: spec.tls.termination
          value: reencrypt
        template: templates/log-gateway/route.yaml
      - equal:
          path: spec.scaleTargetRef.name
          value: RELEASE-NAME-digital-trust-common-service-log-gateway
        template: templates/log-gateway/hpa.yaml

  - it: keeps the probe listener off the Service
    values:
      - ../ci/ci-values.yaml
    asserts:
      - equal:
          path: spec.ports[0].name
          value: https
        template: templates/log-gateway/service.yaml
      - lengthEqual:
          path: spec.ports
          count: 1
        template: templates/log-gateway/service.yaml

  - it: never puts the Loki credential in the ConfigMap
    values:
      - ../ci/ci-values.yaml
    asserts:
      - matchRegex:
          path: data["envoy.yaml"]
          pattern: '%ENVIRONMENT\(LOKI_AUTHORIZATION\)%'
        template: templates/log-gateway/configmap.yaml
        documentIndex: 0
      - notMatchRegex:
          path: data["envoy.yaml"]
          pattern: 'upgrade_configs|with_request_body|headers_to_add:\s+- header:\s+key: x-scope-orgid'
        template: templates/log-gateway/configmap.yaml
        documentIndex: 0

  - it: defaults the log access selector to the gateway labels
    values:
      - ../ci/ci-values.yaml
    asserts:
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: log-gateway
        template: templates/log-access-service.yaml
        documentIndex: 1

  - it: lets the gateway reach the decision endpoint and Loki only
    values:
      - ../ci/ci-values.yaml
    asserts:
      - contains:
          path: spec.egress[1].ports
          content:
            protocol: TCP
            port: 8080
        template: templates/networkpolicy.yaml
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-digital-trust-common-service-log-gateway-egress

  - it: refuses to render without a Loki host
    values:
      - ../ci/ci-values.yaml
    set:
      logGateway:
        upstream:
          host: ""
    asserts:
      - failedTemplate:
          errorPattern: upstream.host
        template: templates/log-gateway/deployment.yaml

  - it: refuses to render without the log access endpoint
    values:
      - ../ci/ci-values.yaml
    set:
      logAccess:
        enabled: false
    asserts:
      - failedTemplate:
          errorPattern: logAccess.enabled
        template: templates/log-gateway/deployment.yaml

  - it: scrapes the metrics port and admits only the monitoring namespace
    values:
      - ../ci/ci-values.yaml
    asserts:
      - equal:
          path: spec.podMetricsEndpoints[0].port
          value: metrics
        template: templates/log-gateway/podmonitor.yaml
      - equal:
          path: spec.podMetricsEndpoints[0].path
          value: /stats/prometheus
        template: templates/log-gateway/podmonitor.yaml
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9102
            protocol: TCP
        template: templates/log-gateway/deployment.yaml
      - equal:
          path: spec.ingress[0].ports[0].port
          value: metrics
        template: templates/networkpolicy.yaml
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-digital-trust-common-service-log-gateway-allow-metrics
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels
          value:
            network.openshift.io/policy-group: monitoring
        template: templates/networkpolicy.yaml
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-digital-trust-common-service-log-gateway-allow-metrics
      - equal:
          path: spec.ingress[0].from[1].podSelector.matchLabels
          value:
            app.kubernetes.io/name: alloy
        template: templates/networkpolicy.yaml
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-digital-trust-common-service-log-gateway-allow-metrics

  - it: renders no monitoring resources by default
    set:
      logAccess:
        enabled: true
      logGateway:
        enabled: true
        upstream:
          host: loki.example.svc
          auth:
            existingSecret:
              name: loki-login
    asserts:
      - hasDocuments:
          count: 0
        template: templates/log-gateway/podmonitor.yaml
      - hasDocuments:
          count: 0
        template: templates/log-gateway/prometheusrule.yaml

  - it: alerts on a down gateway, decision failures and an expiring certificate
    values:
      - ../ci/ci-values.yaml
    set:
      logGateway:
        metrics:
          prometheusRule:
            alertLabels:
              team: platform
    asserts:
      - exists:
          path: spec.groups[0].rules[?(@.alert == "LogGatewayDown")]
        template: templates/log-gateway/prometheusrule.yaml
      - exists:
          path: spec.groups[0].rules[?(@.alert == "LogGatewayDecisionEndpointErrors")]
        template: templates/log-gateway/prometheusrule.yaml
      - exists:
          path: spec.groups[0].rules[?(@.alert == "LogGatewayCertificateExpiring")]
        template: templates/log-gateway/prometheusrule.yaml
      - equal:
          path: spec.groups[0].rules[0].labels.team
          value: platform
        template: templates/log-gateway/prometheusrule.yaml

  - it: tells one release's series from another's in a shared namespace
    release:
      name: pr-12
    values:
      - ../ci/ci-values.yaml
    asserts:
      - equal:
          path: spec.podMetricsEndpoints[0].relabelings[0]
          value:
            sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            targetLabel: release
        template: templates/log-gateway/podmonitor.yaml
      - notExists:
          path: spec.jobLabel
        template: templates/log-gateway/podmonitor.yaml
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: 'up\{release="pr-12",namespace="[^"]+"\}'
        template: templates/log-gateway/prometheusrule.yaml
      - notMatchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: 'job='
        template: templates/log-gateway/prometheusrule.yaml
      - equal:
          path: spec.groups[0].rules[0].labels.release
          value: pr-12
        template: templates/log-gateway/prometheusrule.yaml
      - equal:
          path: spec.groups[0].rules[7].labels.release
          value: pr-12
        template: templates/log-gateway/prometheusrule.yaml

  - it: pins the security settings in the rendered Envoy config
    values:
      - ../ci/ci-values.yaml
    asserts:
      - matchRegex:
          path: data["envoy.yaml"]
          pattern: 'failure_mode_allow: false'
        template: templates/log-gateway/configmap.yaml
        documentIndex: 0
      - matchRegex:
          path: data["envoy.yaml"]
          pattern: 'path_with_escaped_slashes_action: REJECT_REQUEST'
        template: templates/log-gateway/configmap.yaml
        documentIndex: 0
      - matchRegex:
          path: data["envoy.yaml"]
          pattern: 'allowed_upstream_headers:\s+patterns:\s+- exact: x-scope-orgid'
        template: templates/log-gateway/configmap.yaml
        documentIndex: 0
      - matchRegex:
          path: data["envoy.yaml"]
          pattern: 'request_headers_to_remove:\s+- authorization'
        template: templates/log-gateway/configmap.yaml
        documentIndex: 0
      - matchRegex:
          path: data["envoy.yaml"]
          pattern: 'prefix: /\s+direct_response:\s+status: 403'
        template: templates/log-gateway/configmap.yaml
        documentIndex: 0
      - notMatchRegex:
          path: data["envoy.yaml"]
          pattern: '/loki/api/v1/tail'
        template: templates/log-gateway/configmap.yaml
        documentIndex: 0

  - it: maps Envoy's own failures to JSON and sets the long-query timeouts
    values:
      - ../ci/ci-values.yaml
    asserts:
      - matchRegex:
          path: data["envoy.yaml"]
          pattern: 'op: GE\s+value:\s+default_value: 500[\s\S]*?inline_string: ''\{"error":"unavailable"\}'''
        template: templates/log-gateway/configmap.yaml
        documentIndex: 0
      - matchRegex:
          path: data["envoy.yaml"]
          pattern: 'idle_timeout: 4s'
        template: templates/log-gateway/configmap.yaml
        documentIndex: 0
      - notMatchRegex:
          path: data["envoy.yaml"]
          pattern: 'retry_policy'
        template: templates/log-gateway/configmap.yaml
        documentIndex: 0
      - matchRegex:
          path: data["envoy.yaml"]
          pattern: 'timeout: 65s'
        template: templates/log-gateway/configmap.yaml
        documentIndex: 0
      - equal:
          path: metadata.annotations["haproxy.router.openshift.io/timeout"]
          value: 70s
        template: templates/log-gateway/route.yaml

  - it: admits extra ingress peers to the gateway only when asked
    values:
      - ../ci/ci-values.yaml
    set:
      networkPolicy:
        logGateway:
          ingressPeers:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: grafana
    asserts:
      - lengthEqual:
          path: spec.ingress[0].from
          count: 2
        template: templates/networkpolicy.yaml
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-digital-trust-common-service-log-gateway-allow-router
      - equal:
          path: spec.ingress[0].from[1].podSelector.matchLabels
          value:
            app.kubernetes.io/name: grafana
        template: templates/networkpolicy.yaml
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-digital-trust-common-service-log-gateway-allow-router

  - it: has only the router peer by default
    values:
      - ../ci/ci-values.yaml
    asserts:
      - lengthEqual:
          path: spec.ingress[0].from
          count: 1
        template: templates/networkpolicy.yaml
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-digital-trust-common-service-log-gateway-allow-router

  - it: keeps both ConfigMap names distinct when the fullname is 49 characters
    values:
      - ../ci/ci-values.yaml
    set:
      fullnameOverride: abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklm
    asserts:
      - equal:
          path: metadata.name
          value: abcdefghijklmnopqrstuvwxyz0123456789abcdefgh-log-gateway-config
        template: templates/log-gateway/configmap.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: abcdefghijklmnopqrstuvwxyz0123456789abcdefgh-log-gateway-ca
        template: templates/log-gateway/configmap.yaml
        documentIndex: 1

  - it: refuses to render with network policies disabled
    values:
      - ../ci/ci-values.yaml
    set:
      networkPolicy:
        enabled: false
    asserts:
      - failedTemplate:
          errorPattern: networkPolicy.enabled must be true
        template: templates/log-gateway/deployment.yaml

  - it: refuses to render without the Loki login Secret name
    values:
      - ../ci/ci-values.yaml
    set:
      logGateway:
        upstream:
          auth:
            existingSecret:
              name: ""
    asserts:
      - failedTemplate:
          errorPattern: upstream.auth.existingSecret.name
        template: templates/log-gateway/deployment.yaml
