name: Build and Push Image
description: Build a multi-arch Docker image and push to a container registry

inputs:
  image_name:
    description: "Image repository path without the registry (e.g. bcgov/digital-trust-common-service); the action prepends <registry>/ itself"
    required: true
  registry:
    description: "Container registry to push to"
    required: false
    default: "ghcr.io"
  registry_username:
    description: "Registry username for authentication"
    required: true
  registry_password:
    description: "Registry password or token for authentication"
    required: true
  context:
    description: "Docker build context path"
    required: false
    default: "."
  dockerfile:
    description: "Path to Dockerfile relative to context"
    required: false
    default: "Dockerfile"
  platforms:
    description: "Target platforms for the image build"
    required: false
    default: "linux/amd64,linux/arm64"
  pr_number:
    description: "Pull request number. When set, produces pr-<N> and pr-<N>-<short-sha> tags instead of branch/semver tags."
    required: false
    default: ""

outputs:
  image_ref:
    description: "Digest-pinned image reference (e.g. ghcr.io/bcgov/digital-trust-common-service@sha256:...)"
    value: ${{ steps.build.outputs.digest && format('{0}/{1}@{2}', inputs.registry, inputs.image_name, steps.build.outputs.digest) || '' }}
  image_version:
    description: "Image version from metadata"
    value: ${{ steps.meta.outputs.version }}
  tags:
    description: "All tags applied to the image"
    value: ${{ steps.meta.outputs.tags }}
  image_tag:
    description: "PR tag (pr-<N>) when pr_number is set; the metadata version otherwise"
    value: ${{ inputs.pr_number && format('pr-{0}', inputs.pr_number) || steps.meta.outputs.version }}

runs:
  using: composite
  steps:
    - name: Set up QEMU
      # Emulation is only needed when building non-native (arm) platforms.
      if: contains(inputs.platforms, 'arm')
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Log in to container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry_username }}
        password: ${{ inputs.registry_password }}

    - name: Compute PR tag
      id: tags
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        if [ -n "${PR_NUMBER}" ]; then
          echo "pr_tags=type=raw,value=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
        else
          echo "pr_tags=" >> "$GITHUB_OUTPUT"
        fi

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ inputs.registry }}/${{ inputs.image_name }}
        tags: |
          ${{ steps.tags.outputs.pr_tags }}
          type=sha,prefix=sha-,enable=${{ inputs.pr_number == '' }}
          type=raw,value=main,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Build and push image
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: mode=min
        sbom: true
