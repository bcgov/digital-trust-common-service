name: CI Checks

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:ci
      - name: Run actionlint
        shell: bash
        run: |
          # Pin both the installer script (tag ref) and the binary version
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color .github/workflows/*.yml

  commits:
    runs-on: ubuntu-latest
    # The husky commit-msg hook is bypassable and absent in clones that skip
    # npm install, so CI is the real gate. cd.yml also calls this workflow,
    # where no pull_request context exists.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Lint pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

      - name: Lint pull request commit messages
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache NestJS build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist
            tsconfig.build.tsbuildinfo
          key: nest-build-${{ github.sha }}
          restore-keys: nest-build-
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    # The full job runs in ~2 minutes. A jest suite that leaves a database pool
    # open never exits on its own, so without a cap a hung run holds a runner
    # until the 6-hour default (see the e2e hang on PR #168).
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dc_common_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: dc_common_service
      DB_LOGGING: 'false'
      NODE_ENV: test
      CONNECTOR_ENCRYPTION_KEYS_PATH: './config/encryption-keys.json'
      UPSTREAM_IDENTITY_FEDERATION_CONFIG_PATH: './config/upstream-identity-federation.json'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:cov
      - name: Build and apply migrations
        # DatabaseModule always runs with synchronize: false, so specs that
        # touch real tables require the schema to be created via migrations
        # first; nothing else in this job does that.
        run: |
          npm run build
          npm run migrate:up
      - name: Run integration tests
        run: npm run test:integration
      - name: Run e2e tests
        run: npm run test:e2e
      - name: Report coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage/lcov.info

  helm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5.0.1
        with:
          version: v3.16.2
      - name: Helm lint
        working-directory: charts
        run: |
          helm lint digital-trust-common-service
          helm lint digital-trust-common-service -f digital-trust-common-service/ci/ci-values.yaml
          # Glob so new overlays (e.g. values-pr.yaml) are covered automatically
          for f in digital-trust-common-service/values-*.yaml; do
            helm lint digital-trust-common-service -f "$f" \
              --set-file oidcSigning.keys=digital-trust-common-service/ci/placeholder-oidc-keys.json \
              --set-json connectorEncryption.keys='{"1":"ci-connector-encryption-key"}'
          done
      - name: Helm template (render all values files)
        working-directory: charts
        run: |
          helm template ci digital-trust-common-service -f digital-trust-common-service/ci/ci-values.yaml > /dev/null
          # Overlays that enable oidcSigning.create / connectorEncryption.create
          # expect keys to be injected at deploy time. Supply placeholders so
          # smoke renders exercise the Secret templates instead of fail-closed guards.
          for f in digital-trust-common-service/values-*.yaml; do
            helm template rel digital-trust-common-service -f "$f" \
              --set-file oidcSigning.keys=digital-trust-common-service/ci/placeholder-oidc-keys.json \
              --set-json connectorEncryption.keys='{"1":"ci-connector-encryption-key"}' > /dev/null
          done
      - name: Helm unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.1
          helm unittest charts/digital-trust-common-service
      - name: yamllint (values and Chart.yaml)
        run: |
          pipx install yamllint || pip install yamllint
          yamllint --strict -c .yamllint \
            charts/digital-trust-common-service/values.yaml \
            charts/digital-trust-common-service/values-*.yaml \
            charts/digital-trust-common-service/ci/ci-values.yaml \
            charts/digital-trust-common-service/Chart.yaml
      - name: helm-docs (verify README is up to date)
        run: |
          GO111MODULE=on go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2
          "$(go env GOPATH)/bin/helm-docs" --chart-search-root=charts --template-files=README.md.gotmpl
          git diff --exit-code charts/digital-trust-common-service/README.md \
            || { echo "README.md is out of date. Run helm-docs and commit the result."; exit 1; }

  ui:
    runs-on: ubuntu-latest
    # Same guard as the test job: a hung vitest run must not hold a runner
    # for the 6-hour default.
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - run: npm ci
      - name: Verify generated API types are current
        run: |
          npm run types:spec
          git diff --exit-code -- src/lib/api/types.gen.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
