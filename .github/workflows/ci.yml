name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-checks:
    if: >-
      github.event.action != 'edited' ||
      github.event.changes.title != null
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci-checks.yml
    secrets: inherit
