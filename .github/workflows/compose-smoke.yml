name: Compose smoke

# The rest of CI never reads docker-compose.yml: the test job stands Postgres
# up through Actions `services:` and sets DB_* as workflow env, so it never
# reads .env, .env.example, or starts Keycloak, Caddy and the containerized
# app. This job runs the documented clean-clone quick start instead.
on:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - '.env.example'
      - 'Dockerfile'
      - 'caddy/**'
      - 'keycloak/**'
      - 'config/**'
      - 'scripts/generate-oidc-keys.mjs'
      - '.github/workflows/compose-smoke.yml'

concurrency:
  group: compose-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    # A cold run is ~6 minutes. The cap is here so a stack that never
    # converges cannot hold a runner for the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Unedited on purpose: this asserts the checked-in example is enough on
      # its own, which is exactly the class of bug this job exists to catch.
      - name: Copy the example environment
        run: cp .env.example .env

      # config/ is mounted read-only into app, so the service's own fallback
      # cannot write a generated key there. Building the image here also warms
      # the build that `up` then reuses.
      - name: Generate OIDC signing keys
        run: |
          docker compose run --build --rm --no-deps app \
            node scripts/generate-oidc-keys.mjs oidc-keys.json
          mv oidc-keys.json config/oidc-keys.json

      # Asserts most of the stack on its own: compose waits for migrate to
      # complete and for app to report healthy, and app only gets there once
      # upstream OIDC discovery against Keycloak has succeeded.
      - name: Start the stack
        run: docker compose up -d

      # Not covered by the above: the app is reached directly on :3000 there,
      # never through Caddy's app.localhost front door.
      - name: Check the front door
        run: |
          docker compose cp \
            caddy:/data/caddy/pki/authorities/local/root.crt \
            ./caddy/root.crt
          curl -fsS --cacert ./caddy/root.crt \
            --resolve app.localhost:443:127.0.0.1 \
            https://app.localhost/health/live

      # The one service nothing else gates, so the only one that fails quietly.
      - name: Check the seed succeeded
        shell: bash
        run: |
          set -euo pipefail
          timeout 300 docker compose wait seed
          code=$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq seed)")
          if [ "$code" != 0 ]; then
            echo "::error::seed exited with ${code}"
            exit 1
          fi

      - name: Dump stack state
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps
