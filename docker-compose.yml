# Integration test database stack:
#   docker compose --profile test up -d db-test migrate-test seed-test
#   docker compose --profile test down -v
# Compose keeps unprofiled services enabled, so target the test services above to
# start only the isolated PostgreSQL test database on localhost:5433, then run
# migrations and the test seed script against dc_common_service_test.
services:
  app:
    build:
      context: .
      target: deps
    command: npm run start:dev
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - ./config:/app/config:ro
      # Caddy's root certificate only, published by caddy-ca. Mounting
      # caddy_data directly would also expose the CA private key.
      - caddy-ca:/caddy-ca:ro
    env_file:
      - .env
    environment:
      # Container-mode values; .env stays correct for the host workflow.
      DB_HOST: db
      NODE_EXTRA_CA_CERTS: /caddy-ca/root.crt
      # .env carries http://localhost:4318 so the default workflow (the API on
      # the host) works unedited. In compose the collector is a sibling
      # container, so point at it by service name. An inline `environment`
      # value wins over `env_file`.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    depends_on:
      db:
        condition: service_healthy
      # Completing means the certificate exists, which `caddy: started` would
      # not guarantee — Caddy mints its CA a moment after the process starts.
      caddy-ca:
        condition: service_completed_successfully
  migrate:
    build:
      context: .
      target: deps
    command: sh -c "npm run build && npm run migrate:up"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: .
      target: deps
    command: sh -c "npm run seed"
    volumes:
      - .:/app
      - /app/node_modules
      - ./config:/app/config:ro
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:18.4
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dc_common_service
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:18.4
    profiles: ['test']
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dc_common_service_test
    volumes:
      - postgres-test-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dc_common_service_test']
      interval: 5s
      timeout: 5s
      retries: 5

  migrate-test:
    build:
      context: .
      target: deps
    profiles: ['test']
    command: sh -c "npm run build && npm run migrate:up"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: test
      DB_HOST: db-test
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: dc_common_service_test
      DB_LOGGING: 'false'
    depends_on:
      db-test:
        condition: service_healthy

  seed-test:
    image: postgres:18.4
    profiles: ['test']
    command: >-
      sh -c "psql -v ON_ERROR_STOP=1 -h db-test -p 5432 -U postgres -d dc_common_service_test
      -f /seeds/test-seed.sql"
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./libs/database/src/seeds/test-seed.sql:/seeds/test-seed.sql:ro
    depends_on:
      migrate-test:
        condition: service_completed_successfully

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    command: start-dev --import-realm
    # Unprofiled: the app performs upstream OIDC discovery in onModuleInit, so
    # it cannot start without Keycloak. Hiding it behind a profile made a bare
    # `docker compose up` impossible.
    ports:
      - '8080:8080'
    volumes:
      - ./keycloak/config:/opt/keycloak/data/import
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT: 'true'
      # To use https which is required for OIDC
      KC_HOSTNAME: 'https://keycloak.localhost'
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak']
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional containerized Vite dev server (host-based `npm run dev` in apps/ui
  # stays the default workflow). Publishes 5173 so Caddy can reach it at
  # host.docker.internal:5173 whether the UI runs here or on the host.
  ui:
    image: node:24-alpine
    profiles: ['ui']
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - '5173:5173'
    volumes:
      - ./apps/ui:/app
      - /app/node_modules

  caddy:
    image: caddy:2
    # Containers resolve these to Caddy, so the API reaches Keycloak and its
    # own JWKS by the same hostnames the browser uses.
    networks:
      default:
        aliases:
          - keycloak.localhost
          - app.localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Publishes Caddy's root certificate on its own volume, so containers that
  # need to trust it never mount caddy_data — which holds the CA private key
  # beside it. Waits for Caddy to generate the CA, then exits.
  caddy-ca:
    image: alpine:3
    command:
      - sh
      - -c
      - |
        src=/caddy-data/caddy/pki/authorities/local/root.crt
        until [ -f "$$src" ]; do sleep 1; done
        cp "$$src" /out/root.crt
    volumes:
      - caddy_data:/caddy-data:ro
      - caddy-ca:/out
    depends_on:
      - caddy

  # Local observability backend: Grafana, Loki, Tempo, Mimir, Pyroscope and an
  # OTel Collector in a single container — the same backends the deployed
  # stack uses, so instrumentation can be validated before it reaches
  # OpenShift. Opt-in behind the `obs` profile because it runs five backends
  # and is only needed when working on telemetry:
  #   docker compose --profile obs up -d lgtm
  # Storage is in-container, so `docker compose down` discards dashboards and
  # collected telemetry.
  lgtm:
    image: grafana/otel-lgtm:0.31.0
    profiles: ['obs']
    ports:
      # Grafana on 3001: the `app` service already publishes 3000. Also
      # reachable at https://grafana.localhost through Caddy.
      - '3001:3000'
      - '4317:4317'
      # OTLP/HTTP. The platform standard is http/protobuf on 4318; 4317 above
      # is gRPC, published only so an experiment does not need a compose edit.
      - '4318:4318'
    environment:
      # Skip the login screen locally. Remove both to get the default
      # admin/admin sign-in instead.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/dashboards/digital-trust-local.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/digital-trust-local.yaml:ro
      - ./observability/grafana/dashboards/digital-trust-local.json:/etc/grafana/provisioning/digital-trust/digital-trust-local.json:ro


volumes:
  postgres-data:
  postgres-test-data:
  keycloak-db-data:
  caddy_data:
  caddy_config:
  caddy-ca:
